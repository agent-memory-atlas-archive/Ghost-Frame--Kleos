name: JavaScript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Exercise both lockfiles so dependency updates have build and test evidence.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [gui, sdk/typescript]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
